<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Repo Feed — поиск проектов на GitHub</title>
<meta name="description" content="Лента, свайпы и живой поиск по публичным репозиториям GitHub." />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://opengraph.githubassets.com https://avatars.githubusercontent.com; connect-src https://api.github.com https://github.com; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'" />
<style>
  :root {
    --bg: #0d1117;
    --bg-2: #010409;
    --panel: #161b22;
    --panel-2: #1c2129;
    --panel-3: #21262d;
    --border: #30363d;
    --border-soft: #21262d;
    --text: #e6edf3;
    --muted: #8b949e;
    --muted-2: #6e7681;
    --accent: #4493f8;
    --accent-ink: #04101f;
    --like: #3fb950;
    --skip: #f85149;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    --radius: 14px;
    --shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background:
      radial-gradient(1200px 600px at 50% -10%, #12203a 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow-x: clip;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 14px 20px 18px;
  }
  button { font-family: inherit; }
  :is(button, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- Верхняя панель ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--muted);
    letter-spacing: .02em;
    white-space: nowrap;
    display: flex; align-items: center; gap: 7px;
  }
  .logo .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .logo b { color: var(--text); }
  .search {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .search input {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 12px;
    font-family: var(--mono);
    font-size: 13px;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(68,147,248,.15);
  }
  .icon-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 0 12px;
    height: 38px;
    cursor: pointer;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, color .15s, background .15s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--text); }

  /* ---------- Вкладки ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 4px;
  }
  .tabs button {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px 6px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background .15s, color .15s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active {
    color: var(--text);
    background: var(--panel-3);
    box-shadow: inset 0 0 0 1px var(--border);
  }


  /* Лента */
  #deckWrap { width: 100%; margin: 10px auto 0; flex-direction: column; }
  .deck-stage {
    display: grid; grid-template-columns: 64px minmax(0, 540px) 64px;
    justify-content: center; align-items: center; column-gap: 22px; row-gap: 20px;
  }
  #stack { display: grid; grid-area: 1 / 2; isolation: isolate; min-width: 0; }
  .card {
    position: relative; grid-area: 1 / 1; min-width: 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    overflow: hidden; box-shadow: 0 18px 48px #0005;
    transition: transform .22s ease, opacity .22s ease;
  }
  .card[data-swiping] { pointer-events: none; }
  .card .cover {
    position: relative; width: 100%; aspect-ratio: 2 / 1; overflow: hidden;
    touch-action: pan-y; user-select: none;
    background: radial-gradient(ellipse at 75% 45%, #293a58, transparent 66%), #152031;
    border-bottom: 1px solid var(--border);
  }
  .cover::before {
    content: ""; position: absolute; inset: 0; opacity: .25;
    background: repeating-linear-gradient(0deg, transparent 0 23px, #809bca40 23px 24px),
                repeating-linear-gradient(90deg, transparent 0 23px, #809bca40 23px 24px);
  }
  .cover-fallback {
    position: absolute; inset: 0; display: grid; place-content: center;
    color: #d7e4f8; text-align: center; font: 600 clamp(14px, 3.8vw, 22px) var(--mono);
    padding: 20px; overflow-wrap: anywhere;
  }
  .cover-fallback span { color: #91b4ef; font-size: 1.8em; margin-bottom: 12px; }
  .cover img {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    object-fit: cover; opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  .cover img.ready { opacity: 1; }
  .card .body { padding: 20px 24px; touch-action: pan-y; }
  .card .owner { color: var(--muted); font: 12px var(--mono); margin: 0 0 5px; }
  .card h2 { margin: 0 0 10px; font-size: clamp(21px, 4vw, 30px); line-height: 1.12; overflow-wrap: anywhere; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; text-underline-offset: .16em; }
  .card h2 a span { color: var(--muted); font-size: .55em; vertical-align: .18em; }
  .card .desc { color: #bbc6d3; font-size: 14px; line-height: 1.55; margin: 0 0 14px; }
  .card .topics { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .card .topics span {
    color: #abb8ca; background: #202833; border: 1px solid #303a48;
    font: 11px var(--mono); padding: 4px 8px; border-radius: 6px;
  }
  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 13px; }
  .card .stats { display: flex; flex-wrap: wrap; gap: 12px; font: 12px var(--mono); color: #a7b2bf; }
  .lang-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .summary-btn, .summary-close {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  .summary-btn:hover, .summary-close:hover { background: var(--panel-3); }
  .stamp {
    position: absolute; z-index: 1; top: 10px; color: #d5d9de; background: #1b2028ee;
    border: 1px solid #798391; border-radius: 8px; font: 600 12px var(--mono);
    padding: 8px 10px; opacity: 0; pointer-events: none;
  }
  .stamp.skip { left: 12px; }
  .stamp.like { right: 12px; }
  .swipe-action {
    display: grid; place-items: center; gap: 7px; padding: 0; border: 0; background: none;
    color: #a0a9b4; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .swipe-action .swipe-icon {
    display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid #3a414a; background: #181d24; color: #bbc2cb;
  }
  .swipe-action:hover .swipe-icon { background: #232a33; border-color: #68717d; }
  .swipe-icon svg { display: block; width: 20px; height: 20px; }
  .swipe-action:disabled { opacity: .4; cursor: default; }
  #skipBtn { grid-area: 1 / 1; }
  #likeBtn { grid-area: 1 / 3; }
  #undoBtn {
    grid-area: 2 / 2; justify-self: center; border: 0; color: #a7b0bb;
    background: none; padding: 8px 10px; cursor: pointer;
  }
  #undoBtn:disabled { opacity: .45; cursor: default; }
  [hidden] { display: none !important; }
  #accountBtn { flex: none; margin-inline-start: auto; }
  .account-dialog {
    width: min(460px, calc(100% - 32px)); padding: 22px; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  }
  .account-dialog::backdrop { background: #080b12b8; }
  .account-dialog h2 { margin: 0 0 12px; font-size: 20px; }
  .account-dialog input, .account-dialog button {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel-2); color: var(--text);
  }
  .account-dialog input { width: 100%; }
  .account-dialog form { display: grid; gap: 8px; margin-top: 12px; }
  .account-dialog a { color: var(--accent); overflow-wrap: anywhere; }
  .account-dialog > a, .account-dialog > button { margin: 0 8px 8px 0; }
  #summaryText { white-space: pre-line; }
  #summaryDialog {
    width: min(460px, calc(100% - 32px)); padding: 24px; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  }
  #summaryDialog::backdrop { background: #080b12b8; }
  #summaryDialog h2 { margin: 0; font-size: 20px; }
  #summaryDialog p { color: #bbc6d3; line-height: 1.6; }
  #summaryDialog small { color: var(--muted); }
  #summaryDialog form { margin-top: 18px; text-align: right; }
  .demo-note { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.4; }
  #stack > .state { position: static; min-height: 205px; padding: 24px; border: 1px solid var(--border); border-radius: 16px; }
  @media (max-width: 620px) {
    .deck-stage { grid-template-columns: 1fr minmax(76px, auto) 1fr; column-gap: 8px; row-gap: 15px; }
    #stack { grid-area: 1 / 1 / 2 / 4; }
    #skipBtn { grid-area: 2 / 1; justify-self: end; }
    #likeBtn { grid-area: 2 / 3; justify-self: start; }
    .card .body { padding: 15px 16px; }
  }
  @media (max-width: 540px) {
    #app { padding: 14px 12px 24px; }
    .tabs { gap: 1px; }
    .tabs button { font-size: 11px; padding: 9px 2px; }
    .tabs button[data-mode="liked"] { flex-grow: 1.55; }
  }
  /* ---------- Панели (список / история / лайки) ---------- */
  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .panel.active { display: flex; }
  .panel-controls {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted);
    gap: 10px; flex-wrap: wrap;
  }
  .panel-controls select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 5px 7px; font-family: var(--mono); font-size: 12px;
  }
  .pager { display: flex; align-items: center; gap: 8px; }
  .pager button {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; width: 28px; height: 28px; cursor: pointer;
  }
  .pager button:disabled { opacity: .35; cursor: default; }
  .filter-tabs { display: flex; gap: 6px; }
  .filter-tabs button {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    padding: 5px 13px; border-radius: 20px; cursor: pointer;
    font-family: var(--mono); font-size: 12px;
  }
  .filter-tabs button.active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .rows {
    flex: 1; overflow-y: auto;
    border: 1px solid var(--border-soft); border-radius: 12px;
    background: var(--panel);
  }
  .row {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; text-decoration: none; color: var(--text);
    border-bottom: 1px solid var(--border-soft);
    transition: background .1s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--panel-2); }
  .row .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    flex-shrink: 0; background: var(--panel-3); object-fit: cover;
  }
  .row .action-icon {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .row .action-icon { background: var(--panel-3); color: var(--muted); }
  .row .name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--mono); font-size: 13px; color: var(--text); text-decoration: none;
  }
  .row .name:hover { color: var(--accent); }
  .row .name .ownr { color: var(--muted); }
  .row .row-stars { flex-shrink: 0; font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-width: 56px; text-align: right; }
  .row .row-tags { display: flex; gap: 4px; flex-shrink: 0; max-width: 40%; overflow: hidden; }
  .row .row-tags span {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--accent);
    font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 10px;
    white-space: nowrap; flex-shrink: 0;
  }
  .row .remove-btn {
    flex-shrink: 0; background: none; border: none; color: var(--muted-2);
    cursor: pointer; font-size: 14px; padding: 2px 4px;
  }
  .row .remove-btn:hover { color: var(--skip); }

  /* ---------- Состояния / скелетоны ---------- */
  .state {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; text-align: center; padding: 24px;
    color: var(--muted);
  }
  .state button {
    background: var(--accent); color: var(--accent-ink); border: none;
    font-weight: 600; padding: 9px 18px; border-radius: 9px; cursor: pointer;
  }
  .note { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 14px; line-height: 1.6; }
  .skel {
    background: linear-gradient(90deg, var(--panel) 25%, var(--panel-3) 37%, var(--panel) 63%);
    background-size: 400% 100%; animation: sweep 1.3s ease infinite; border-radius: 6px;
  }
  @keyframes sweep { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .skel-row { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-bottom: 1px solid var(--border-soft); }
  .skel-row .c { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
  .skel-row .l { height: 12px; flex: 1; }

  /* ---------- Тосты ---------- */
  #toasts {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 50; align-items: center;
  }
  .toast {
    background: var(--panel-3); border: 1px solid var(--border); color: var(--text);
    padding: 9px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow);
    animation: rise .2s ease; max-width: 90vw;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- Модалка настроек ---------- */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(1,4,9,.7);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; max-width: 460px; width: 100%; box-shadow: var(--shadow);
  }
  .modal h3 { margin: 0 0 6px; font-size: 17px; }
  .modal p { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 14px; }
  .modal p a { color: var(--accent); }
  .modal input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 10px 12px; font-family: var(--mono); font-size: 13px; margin-bottom: 14px;
  }
  .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal button {
    border-radius: 9px; padding: 9px 16px; cursor: pointer; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); background: var(--panel-3); color: var(--text);
  }
  .modal button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .rate-badge { font-family: var(--mono); font-size: 11px; color: var(--muted-2); margin-top: 4px; }

</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="topbar">
      <span class="logo"><span class="dot"></span><span class="txt">repo<b>feed</b></span></span>
      <div class="search">
        <input id="tagInput" type="text" aria-label="Тема репозиториев" placeholder="тег, напр. rust, machine-learning" value="machine-learning" />
        <button class="icon-btn" id="goBtn" title="Искать">↵</button>
      </div>
      <button id="accountBtn" type="button" class="icon-btn">GitHub</button>
    </div>

    <p class="demo-note">Публичные репозитории GitHub. Попробуй темы machine-learning, rust или web.</p>
    <div class="tabs">
      <button data-mode="feed" class="active">Обзор</button>
      <button data-mode="reco">Для вас</button>
      <button data-mode="list">Каталог</button>
      <button data-mode="liked">Сохранённые</button>
      <button data-mode="history">История</button>
    </div>
  </header>

  <!-- Свайп-колода (feed + reco) -->

  <div id="deckWrap">
    <div class="deck-stage">
      <div id="stack" aria-live="polite"></div>
      <button id="skipBtn" class="swipe-action" type="button" aria-label="Пропустить" title="Пропустить (←)"><span class="swipe-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg></span>Пропустить</button>
      <button id="undoBtn" type="button" title="Отменить (Backspace)">↶ Отменить</button>
      <button id="likeBtn" class="swipe-action" type="button" aria-label="Сохранить" title="Сохранить (→)"><span class="swipe-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 8.6c0 4.1-8.5 9.4-8.5 9.4s-8.5-5.3-8.5-9.4a4.4 4.4 0 0 1 8.5-1.5 4.4 4.4 0 0 1 8.5 1.5Z"/></svg></span>Сохранить</button>
    </div>
  </div>

  <!-- Список -->
  <div id="listPanel" class="panel">
    <div class="panel-controls">
      <label>На странице:
        <select id="perPageSelect">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100" selected>100</option>
        </select>
      </label>
      <div class="pager">
        <button id="prevPageBtn">←</button>
        <span id="pageLabel">Стр. 1</span>
        <button id="nextPageBtn">→</button>
      </div>
    </div>
    <div id="listRows" class="rows"></div>
  </div>

  <!-- Избранное -->
  <div id="likedPanel" class="panel">
    <div id="likedRows" class="rows"></div>
  </div>

  <!-- История -->
  <div id="historyPanel" class="panel">
    <div class="panel-controls">
      <div class="filter-tabs">
        <button data-filter="all" class="active">Все</button>
        <button data-filter="like">Сохранённые</button>
        <button data-filter="skip">Пропущенные</button>
      </div>
      <button class="icon-btn" id="clearHistoryBtn" style="height:28px;font-size:12px;padding:0 10px;" title="Очистить историю">Очистить</button>
    </div>
    <div id="historyRows" class="rows"></div>
  </div>
</div>

<div id="toasts"></div>
<dialog id="summaryDialog" aria-labelledby="summaryTitle">
  <h2 id="summaryTitle"></h2>
  <p id="summaryText"></p>
  <small id="summarySource"></small>
  <form method="dialog"><button class="summary-close" autofocus>Закрыть</button></form>
</dialog>

<dialog id="accountDialog" class="account-dialog" aria-labelledby="accountTitle">
  <h2 id="accountTitle">Аккаунт GitHub</h2>
  <p id="accountStatus" role="status">Без входа доступна публичная выдача.</p>
  <button id="deviceLoginBtn" type="button" hidden>Войти через GitHub</button>
  <a id="verifyDevice" target="_blank" rel="noopener noreferrer" hidden>Подтвердить вход в GitHub</a>
  <form id="tokenForm">
    <label for="tokenInput">Токен GitHub для текущей сессии</label>
    <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" />
    <button type="submit">Подключить</button>
    <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Создать токен с доступом к публичным репозиториям</a>
  </form>
  <button id="signOutBtn" type="button" hidden>Выйти</button>
  <form method="dialog"><button class="summary-close">Закрыть</button></form>
</dialog>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
